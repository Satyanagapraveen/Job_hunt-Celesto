services:
  ledger:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ledger
      POSTGRES_PASSWORD: ledger
      POSTGRES_DB: ledger
    ports:
      - "5432:5432"
    volumes:
      - ./seeds:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ledger -d ledger"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

  api:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "8080:8080"
    environment:
      CELESTO_PROVIDER: ${CELESTO_PROVIDER:-cloud}
      CELESTO_API_KEY: ${CELESTO_API_KEY:-replace-me}
      CELESTO_BACKEND: ${CELESTO_BACKEND:-firecracker}
      LLM_BASE_URL: ${LLM_BASE_URL:-https://api.groq.com/openai/v1}
      LLM_API_KEY: ${LLM_API_KEY:-replace-me}
      LLM_MODEL: ${LLM_MODEL:-qwen/qwen3.8-27b}
      DATABASE_URL: postgresql://ledger:ledger@ledger:5432/ledger
      API_PORT: 8080
      REPORTS_DIR: /workspace/reports
      COMMAND_LOG_PATH: /workspace/logs/commands.jsonl
    volumes:
      - ./reports:/workspace/reports
      - ./logs:/workspace/logs
    depends_on:
      ledger:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:8080/health || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s
